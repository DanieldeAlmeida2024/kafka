name: Configuração segura do Kafka local
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker compose -f docker-compose.yaml config --quiet
      - run: python -m unittest discover -s tests -p 'test_compose.py' -v
